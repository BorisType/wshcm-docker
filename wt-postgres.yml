services:
  wt:
    extends:
      file: wt.yml
      service: wt
    environment:
      - SQL_TYPE=PostgreSQL
      - SQL_USERNAME=${POSTGRES_USERNAME}
      - SQL_PASSWORD=${POSTGRES_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - ${WT_HOST_PORT}:${WT_DOCKER_PORT}
    extra_hosts:
      - host.docker.internal:host-gateway
    networks:
      - wt

  postgres:
    image: postgres:16
    command: postgres -c max_connections=300
    environment:
      - POSTGRES_USER=${POSTGRES_USERNAME}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - ./misc/postgres/create_db.sql:/docker-entrypoint-initdb.d/create_tables.sql
      - wtdb-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s
    ports:
      - ${POSTGRES_HOST_PORT}:${POSTGRES_DOCKER_PORT}
    networks:
      - wt

  email:
    image: axllent/mailpit
    ports:
      - ${MAILPIT_HOST_SMTP_PORT}:${MAILPIT_DOCKER_SMTP_PORT}
      - ${MAILPIT_HOST_UI_PORT}:${MAILPIT_DOCKER_UI_PORT}
    networks:
      - wt

  proxy:
    image: nginx:stable-alpine
    depends_on:
      wt:
        condition: service_started
    volumes:
      - ./misc/proxy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - ${PROXY_HOST_PORT}:${PROXY_DOCKER_PORT}
    networks:
      - wt

networks:
  wt:

volumes:
  wtdb-postgres-data:
  wt-data:
  wt-webtutor:
  wt-logs:
  wt-idxs:
  wt-apps: