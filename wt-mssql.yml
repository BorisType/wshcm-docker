
services:
  wt:
    extends:
      file: wt.yml
      service: wt
    environment:
      - SQL_TYPE=MSSQL
      - SQL_USERNAME=${MSSQL_USERNAME}
      - SQL_PASSWORD=${MSSQL_SA_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
        restart: true
    ports:
      - ${WT_HOST_PORT}:${WT_DOCKER_PORT}
    extra_hosts:
      - host.docker.internal:host-gateway
    networks:
      - wt

  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    env_file: .env
    entrypoint: /tmp/config/entrypoint.sh
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${MSSQL_SA_PASSWORD}
    volumes:
      - ./misc/mssql:/tmp/config
      - mssql-data:/var/opt/mssql
    healthcheck:
      test: test -f /tmp/db_init_done && /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 3s
      retries: 60
      start_period: 30s
    ports:
      - ${MSSQL_HOST_PORT}:${MSSQL_DOCKER_PORT}
    networks:
      - wt

  email:
    image: axllent/mailpit
    ports:
      - ${MAILPIT_HOST_SMTP_PORT}:${MAILPIT_DOCKER_SMTP_PORT}
      - ${MAILPIT_HOST_UI_PORT}:${MAILPIT_DOCKER_UI_PORT}
    networks:
      - wt

  proxy:
    image: nginx:stable-alpine
    depends_on:
      wt:
        condition: service_started
    volumes:
      - ./misc/proxy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - ${PROXY_HOST_PORT}:${PROXY_DOCKER_PORT}
    networks:
      - wt

networks:
  wt:

volumes:
  mssql-data:
  wt-data:
  wt-webtutor:
  wt-logs:
  wt-idxs:
  wt-apps: