# Единая публичная точка входа перед WebSoft HCM.
# Нормализация: WT всегда видит фиксированный Host с портом 80,
# поэтому в каталоге hosts достаточно одной строки (*:80),
# а внешний порт может быть любым и меняется без перенастройки WT.
upstream wt {
    server wt:80;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;

    location / {
        proxy_pass http://wt;
        proxy_set_header Host wt:80;
        proxy_redirect http://localhost/ http://$http_host/;
        proxy_redirect http://wt:80/ http://$http_host/;
        proxy_redirect http://wt/ http://$http_host/;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
