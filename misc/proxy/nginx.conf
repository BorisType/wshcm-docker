# Единая публичная точка входа перед WebSoft HCM.
# Нормализация: WT всегда видит фиксированный Host с портом 80,
# поэтому в каталоге hosts достаточно одной строки (*:80),
# а внешний порт может быть любым и меняется без перенастройки WT.
upstream wt {
    server wt:80;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;

    # socket_api.html отдаёт клиенту адрес WS-сервера (vchat, чаты, proctoring),
    # собранный из Host запроса — а мы вынужденно подменяем его на внутренний
    # wt:80, который браузер не резолвит. Возвращаем внешний хост.
    location = /socket_api.html {
        proxy_pass http://wt;
        proxy_set_header Host wt:80;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        # sub_filter не работает на сжатых ответах
        proxy_set_header Accept-Encoding "";
        sub_filter_types application/json;
        sub_filter_once off;
        sub_filter '://wt:80' '://$http_host';
    }

    location / {
        proxy_pass http://wt;
        proxy_set_header Host wt:80;
        # WT вычисляет домен куки из Host (wt:80) и ставит Domain=wt, который
        # браузер отвергает на localhost/127.0.0.1. Подменяем на реальный хост.
        proxy_cookie_domain wt $host;
        proxy_redirect http://localhost/ http://$http_host/;
        proxy_redirect http://wt:80/ http://$http_host/;
        proxy_redirect http://wt/ http://$http_host/;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
